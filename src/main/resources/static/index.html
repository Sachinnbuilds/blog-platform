<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Platform Backend</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #213736;
      color: #f4efe6;
      font-family: Georgia, serif;
    }

    .card {
      max-width: 720px;
      padding: 32px;
      border-radius: 24px;
      background: rgba(244, 239, 230, 0.08);
      border: 1px solid rgba(244, 239, 230, 0.16);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      line-height: 1.7;
      color: rgba(244, 239, 230, 0.82);
    }

    code {
      color: #dccbb8;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Backend is running</h1>
    <p>
      The new React test frontend now lives in <code>frontend/</code> and runs separately with Vite
      while Spring Boot continues running from IntelliJ.
    </p>
    <p>
      Start it with <code>npm.cmd install</code> and <code>npm.cmd run dev</code> inside the
      <code>frontend</code> folder.
    </p>
  </div>
</body>
</html>
